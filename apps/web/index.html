<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFF8F0" />
    <title>Distill - only what matters on the page</title>
    <meta name="description" content="Only what matters on the page. Distill turns letters, forms and web pages into plain words and simple steps. On your device first; your answers never leave it." />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Distill" />
    <meta property="og:title" content="Distill - only what matters on the page" />
    <meta property="og:description" content="Letters, forms and web pages in plain words and simple steps. On your device first; your answers never leave it." />
    <meta property="og:image" content="https://distill-hybrid-ai.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Distill wordmark above a still that turns foreign-language forms into three steps: Read, Check, Done." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Theme stamp before first paint: the stored choice (distill.theme) wins, else the device setting. Must match
         THEME_KEY and the --bg / --fg of BRAND_LIGHT and BRAND_DARK; src/brand/theme.test.ts checks it. -->
    <script>
      (function () {
        var p = null;
        try { p = localStorage.getItem("distill.theme"); } catch (e) {}
        var dark = p === "dark" || (p !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        var r = document.documentElement;
        r.dataset.theme = dark ? "dark" : "light";
        r.style.colorScheme = dark ? "dark" : "light";
        r.style.setProperty("--bg", dark ? "#26112F" : "#FFF8F0");
        r.style.setProperty("--fg", dark ? "#FFF8F0" : "#371C46");
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#26112F" : "#FFF8F0");
      })();
    </script>
    <style>html { background: var(--bg); color: var(--fg); }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
